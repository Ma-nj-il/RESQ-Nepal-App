name: resq-backend-v2

services:
  postgres:
    image: postgis/postgis:18-3.6
    # The upstream PostGIS image is amd64-only. Pin the emulated platform so the
    # local/CI evidence stack behaves consistently on Apple Silicon hosts.
    platform: linux/amd64
    environment:
      POSTGRES_DB: resq
      POSTGRES_USER: resq_migrator
      POSTGRES_PASSWORD: resq-migrator-local
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resq_migrator -d resq']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis-cache:
    image: redis:8.4.0-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis-queue:
    image: redis:8.4.0-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '6380:6379'
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # This upstream directory is owned by appuser; a new /tmp mount is root-owned.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  object-storage:
    # Upstream MinIO CE images were withdrawn in 2026. Silo is the maintained,
    # multi-arch MinIO fork and preserves its S3 API, health routes, and MINIO_* config.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: resq-local-access
      MINIO_ROOT_PASSWORD: resq-local-secret-change-me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migration:
    profiles: ['app']
    build:
      context: .
      target: runtime
    command: ['node', 'dist/apps/migration/main.js']
    env_file: ./docker/container.migration.env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      target: runtime
    command: ['node', 'dist/apps/api/main.js']
    env_file: ./docker/container.api.env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true

  worker:
    profiles: ['app']
    build:
      context: .
      target: runtime
    command: ['node', 'dist/apps/worker/main.js']
    env_file: ./docker/container.worker.env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true

  outbox-relay:
    profiles: ['app']
    build:
      context: .
      target: runtime
    command: ['node', 'dist/apps/outbox-relay/main.js']
    env_file: ./docker/container.outbox.env
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-queue-data:
  kafka-data:
  object-storage-data:
