appId: host.exp.Exponent
---
# UI-refinement verification — booking journey (A), self-contained.
# Launches Expo Go, signs in via demo OTP, then walks the existing booking flow:
# Home (route preview + category) -> Processing radar and same-screen search.
# Preconditions: demo dev server on 8081, Expo Go installed.
# Run: maestro test --udid <SIM_UDID> qa/maestro/maestro-verify-booking.yaml
- launchApp
- openLink: "exp://127.0.0.1:8081"
- extendedWaitUntil:
    visible: ".*Let's dive in to your account.*"
    timeout: 120000
- tapOn: "Driver Login"
- assertVisible: "Login via Demo"
- tapOn: "Return to User Mode"
- assertVisible: ".*Let's dive in to your account.*"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: ".*Welcome Back.*"
    timeout: 20000
- tapOn: "e.g. 98XXXXXXXX"
- eraseText
- inputText: "9812345678"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: ".*Enter OTP Code.*"
    timeout: 30000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- extendedWaitUntil:
    visible: ".*Fill Personal Info.*"
    timeout: 30000
- tapOn: "Enter your full name"
- eraseText
- inputText: "QA Demo User"
- pressKey: Enter
- tapOn: "Enter your email"
- eraseText
- inputText: "qa.demo@resq.test"
- pressKey: Enter
- tapOn: "Select gender, ▼"
- extendedWaitUntil:
    visible: ".*Male.*"
    timeout: 10000
- tapOn: "Female"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*Enable Location.*"
    timeout: 30000
- tapOn: "Maybe Later"
- assertVisible: ".*Find Ambulance.*"
- takeScreenshot: ui-01-home
- tapOn: "Open menu"
- assertVisible: "RESQ Nepal"
- tapOn: "Close menu"
# Simulator GPS can be flaky — if the pickup did not auto-fill, set it here.
- tapOn:
    text: ".*Tap to set pickup location.*"
    optional: true
- tapOn:
    text: ".*Bir Hospital.*"
    optional: true
- extendedWaitUntil:
    visible: ".*Find Ambulance.*"
    timeout: 20000
# ── Destination search: pick a real hospital from the database ──────────────
- tapOn: ".*Tap to search hospital or destination.*"
- extendedWaitUntil:
    visible: ".*Search hospital or destination.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Norvic.*"
    timeout: 30000
- takeScreenshot: ui-02-location-search
- tapOn:
    text: ".*Norvic.*"
    index: 0
- extendedWaitUntil:
    visible: ".*Find Ambulance.*"
    timeout: 20000
- takeScreenshot: ui-03-home-route
# ── Compact category cards: both states are visible and selectable ──────────
- scrollUntilVisible:
    element:
      text: ".*For critical patients requiring emergency or ICU support.*"
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: ui-04-home-patient-selected
- tapOn: ".*For critical patients requiring emergency or ICU support.*"
- takeScreenshot: ui-04b-home-icu-selected
- tapOn: ".*Transport for routine hospital visits and patient transfers.*"
- takeScreenshot: ui-04c-home-patient-selected-again
# ── Primary action keeps the existing Processing radar open while searching ─
- tapOn: ".*Find Ambulance.*"
- extendedWaitUntil:
    visible: ".*Finding an Ambulance.*"
    timeout: 20000
- assertVisible: ".*Demo mode — no booking was sent to dispatch.*"
- assertNotVisible: ".*Booking Status.*"
- assertNotVisible: ".*Ambulance Assigned.*"
- takeScreenshot: ui-05-processing-radar-searching
- scrollUntilVisible:
    element:
      text: "Preview Assigned Ambulance"
    direction: DOWN
    timeout: 10000
- tapOn: "Preview Assigned Ambulance"
- assertVisible: ".*Ambulance Assigned.*"
- scrollUntilVisible:
    element:
      text: "DEMO PREVIEW"
    direction: DOWN
    timeout: 10000
- assertVisible: "DEMO PREVIEW"
- assertVisible: "Maya Demo"
- assertVisible: ".*DEMO-AMB-001.*"
- assertVisible: ".*simulated local coordinates.*"
- assertNotVisible: ".*Booking Status.*"
- takeScreenshot: ui-06-processing-demo-assigned
- tapOn: "Open menu"
- assertVisible: "RESQ Nepal"
- tapOn: "Close menu"
- scrollUntilVisible:
    element:
      text: "Call Driver"
    direction: DOWN
    timeout: 10000
- tapOn: "Call Driver"
- assertVisible: "Driver calling is not connected in this demo."
- tapOn: "OK"
- scrollUntilVisible:
    element:
      text: "Complete Demo Trip"
    direction: DOWN
    timeout: 10000
- tapOn: "Complete Demo Trip"
- assertVisible: "Trip Completed"
- scrollUntilVisible:
    element:
      text: "DEMO-TRIP-001"
    direction: DOWN
    timeout: 10000
- assertVisible: "DEMO-TRIP-001"
- assertVisible: ".*DEMO PREVIEW.*"
- scrollUntilVisible:
    element:
      text: "Duration"
    direction: DOWN
    timeout: 10000
- assertVisible: "Duration"
- scrollUntilVisible:
    element:
      text: "View Receipt"
    direction: DOWN
    timeout: 10000
- assertVisible: "View Receipt"
- takeScreenshot: ui-07-trip-completed
- tapOn: "View Receipt"
- assertVisible: "Demo Trip Receipt"
- scrollUntilVisible:
    element:
      text: "Cash · demo only"
    direction: DOWN
    timeout: 10000
- assertVisible: "Cash · demo only"
- assertVisible: "Driver / vehicle"
- scrollUntilVisible:
    element:
      text: "Continue to Rating"
    direction: DOWN
    timeout: 10000
- assertVisible: "Continue to Rating"
- takeScreenshot: ui-08-demo-receipt
- tapOn: "Continue to Rating"
- assertVisible: "Rate your driver"
- assertVisible: ".*Sample driver.*"
- tapOn: "5 stars"
- assertVisible: "Excellent"
- scrollUntilVisible:
    element:
      text: "Submit Rating"
    direction: DOWN
    timeout: 10000
- tapOn: "Submit Rating"
- assertVisible: "Rating submitted"
- assertVisible: ".*No driver was notified.*"
- takeScreenshot: ui-09-rating-submitted
- tapOn: "Back to Home"
- extendedWaitUntil:
    visible: ".*Find Ambulance.*"
    timeout: 20000
- tapOn: "Open menu"
- scrollUntilVisible:
    element:
      text: "Switch to Driver Mode"
    direction: DOWN
    timeout: 10000
- tapOn: "Switch to Driver Mode"
- assertVisible: "Login via Demo"
- tapOn: "Login via Demo"
- extendedWaitUntil:
    visible: ".*DEMO DRIVER.*"
    timeout: 30000
- tapOn: "☰"
- scrollUntilVisible:
    element:
      text: "Switch to User Mode"
    direction: DOWN
    timeout: 10000
- tapOn: "Switch to User Mode"
- extendedWaitUntil:
    visible: ".*Find Ambulance.*"
    timeout: 20000
