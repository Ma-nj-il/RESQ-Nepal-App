appId: host.exp.Exponent
---
# Evidence probe — secondary vehicle flow still reaches confirmation, with no
# Payment section. Preconditions: signed in, Home with pickup + destination.
- tapOn: "Open menu"
- extendedWaitUntil:
    visible: ".*Your trips.*"
    timeout: 15000
- tapOn: "^Ambulance$"
- extendedWaitUntil:
    visible: ".*Choose ambulance.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*Basic Patient Delivery.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Basic Patient Delivery.*"
- extendedWaitUntil:
    visible: ".*Service Details.*"
    timeout: 20000
- takeScreenshot: confirm-01-service-details
- scrollUntilVisible:
    element:
      text: ".*Continue to Booking.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Continue to Booking.*"
- extendedWaitUntil:
    visible: ".*Confirm Booking.*"
    timeout: 20000
- assertNotVisible: ".*Payment Method.*"
- takeScreenshot: confirm-02-no-payment
- scrollUntilVisible:
    element:
      text: ".*Patient Details.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: confirm-03-patient-details
