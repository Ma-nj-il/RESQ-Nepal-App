appId: host.exp.Exponent
---
# Evidence probe — select a Home category and continue through the existing
# local demo search without an extra vehicle-selection drawer destination.
- runFlow: maestro-signin-demo.yaml
- extendedWaitUntil:
    visible: ".*Find Ambulance.*"
    timeout: 20000
- tapOn:
    text: ".*Tap to set pickup location.*"
    optional: true
- tapOn:
    text: ".*Bir Hospital.*"
    optional: true
- tapOn: ".*Tap to search hospital or destination.*"
- extendedWaitUntil:
    visible: ".*Search hospital or destination.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Norvic.*"
    timeout: 30000
- tapOn:
    text: ".*Norvic.*"
    index: 0
- extendedWaitUntil:
    visible: ".*Find Ambulance.*"
    timeout: 20000
- tapOn: ".*Transport for routine hospital visits and patient transfers.*"
- assertVisible: ".*Selected.*"
- takeScreenshot: confirm-01-home-patient-selected
- tapOn: ".*Find Ambulance.*"
- extendedWaitUntil:
    visible: ".*Finding an Ambulance.*"
    timeout: 20000
- assertNotVisible: ".*Payment Method.*"
- takeScreenshot: confirm-02-no-payment
