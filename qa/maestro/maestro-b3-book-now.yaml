appId: host.exp.Exponent
---
# B3 — sample mode (port 8082): AmbulanceList "Book Now" exploration.
- launchApp
- openLink: "exp://localhost:8082"
- extendedWaitUntil:
    visible: ".*Let's dive in to your account.*"
    timeout: 240000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: ".*Welcome Back.*"
    timeout: 15000
- tapOn: "e.g. 98XXXXXXXX"
- inputText: "9812345678"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: ".*Enter OTP Code.*"
    timeout: 30000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- extendedWaitUntil:
    visible: ".*not verified and no account is created.*"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*Fill Personal Info.*"
    timeout: 15000
- tapOn: "Enter your full name"
- inputText: "QA Sample User"
- pressKey: Enter
- tapOn: "Enter your email"
- inputText: "qa.sample@resq.test"
- pressKey: Enter
- tapOn: "Select gender, ▼"
- extendedWaitUntil:
    visible: ".*Male.*"
    timeout: 10000
- tapOn: "Female"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*Maybe Later.*"
    timeout: 20000
- tapOn: "Maybe Later"
- extendedWaitUntil:
    visible: ".*Let's travel together.*"
    timeout: 20000
- tapOn: ".*Ambulances"
- extendedWaitUntil:
    visible: ".*3 ambulances available.*"
    timeout: 20000
# Cards merge into one accessibility element; tap the first card's Book Now button by position.
- tapOn:
    point: "50%,82%"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: b3-01-book-now
