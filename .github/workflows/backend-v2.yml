name: Backend v2 foundation

on:
  pull_request:
    paths:
      - "backend-v2/**"
      - "docs/backend-rebuild/**"
      - ".github/workflows/backend-v2.yml"
  push:
    branches: [main, feature/nestjs-backend-rebuild]
    paths:
      - "backend-v2/**"
      - "docs/backend-rebuild/**"
      - ".github/workflows/backend-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contracts:events
      - run: npm run architecture
      - run: npm run test:unit
      - run: npm run build
      - name: Exercise offline migration reconciliation
        run: npm run readiness -- reconcile test/fixtures/migration-manifest.synthetic.json "$RUNNER_TEMP/migration-report.json"
      - name: Missing cutover evidence must HOLD
        run: |
          status=0
          npm run readiness -- cutover test/fixtures/cutover-hold.synthetic.json "$RUNNER_TEMP/cutover-report.json" || status=$?
          test "$status" -eq 2
      - name: Block high or critical production dependency advisories
        run: npm run security:audit
      - name: Capture the complete dependency audit for review
        if: always()
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-full.json || true
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-v2-npm-audit
          path: backend-v2/artifacts/npm-audit-full.json
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Migrations, dependencies, and Newman
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Pull PostgreSQL/PostGIS
        run: docker compose pull postgres
      - name: Pull Redis
        run: docker compose pull redis-cache redis-queue
      - name: Pull Kafka
        run: docker compose pull kafka
      - name: Pull object storage
        run: docker compose pull object-storage
      - name: Start real dependencies
        run: |
          docker compose up --detach --wait postgres redis-cache redis-queue kafka object-storage || {
            docker compose ps --all --format json | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              for (const line of input.trim().split("\n").filter(Boolean)) {
                const { Service, State, Health, ExitCode } = JSON.parse(line);
                console.log(`::error::Dependency ${Service}: ${State}, health=${Health}, exit=${ExitCode}`);
              }'
            exit 1
          }
      - name: Apply baseline with an explicit empty-database precondition
        env:
          RESQ_MIGRATION_EXPECTED_CURRENT: NONE
        run: npm run migration:run:local
      - name: Run zero, prior-version, RLS, and dependency integration suites
        env:
          RUN_INTEGRATION: "1"
        run: >-
          node --env-file=docker/local.env --experimental-vm-modules
          ./node_modules/jest/bin/jest.js --selectProjects integration --runInBand
          --reporters=default --reporters=github-actions
      - name: Configure ephemeral Phase 5 data protection
        run: >-
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');
          fs.appendFileSync(process.env.GITHUB_ENV,
          'RESQ_DISPATCH_PATIENT_DATA_ENCRYPTION_KEY_BASE64='+crypto.randomBytes(32).toString('base64')+'\n'+
          'RESQ_DISPATCH_PATIENT_DATA_ENCRYPTION_KEY_ID=ci-phase5-ephemeral\n')"
      - name: Start API for black-box checks
        run: |
          npm run dev:api:local > artifacts-api.log 2>&1 &
          echo "$!" > artifacts-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts-api.log
          exit 1
      - name: Run Postman health collection with Newman
        run: npm run postman:health
      - name: Run Phase 5–6 dispatch and product collection with Newman
        run: npm run postman:core-dispatch
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-v2-api-log
          path: backend-v2/artifacts-api.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop API and dependency stack
        if: always()
        run: |
          if [[ -f artifacts-api.pid ]]; then
            kill "$(cat artifacts-api.pid)" 2>/dev/null || true
          fi
          docker compose down --volumes --remove-orphans

  image:
    name: Production image, SBOM, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the production target
        run: docker build --pull --target runtime --tag resq-backend-v2:${{ github.sha }} backend-v2
      - name: Smoke-test the hardened production image
        run: |
          docker run --detach --name resq-backend-v2-smoke \
            --read-only \
            --tmpfs /tmp:size=16m,noexec,nosuid \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=test \
            --env RESQ_LOG_LEVEL=fatal \
            resq-backend-v2:${{ github.sha }}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs resq-backend-v2-smoke
          exit 1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: resq-backend-v2:${{ github.sha }}
          format: spdx-json
          output-file: backend-v2-sbom.spdx.json
          artifact-name: backend-v2-sbom.spdx.json
      - name: Block high or critical image findings
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: resq-backend-v2:${{ github.sha }}
          format: json
          output: backend-v2-trivy.json
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Publish image finding identifiers
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            if (!fs.existsSync("backend-v2-trivy.json")) {
              console.log("::error::Trivy did not produce a report; scanner setup or execution failed.");
              process.exit(1);
            }
            const report = JSON.parse(fs.readFileSync("backend-v2-trivy.json", "utf8"));
            for (const result of report.Results ?? []) for (const item of result.Vulnerabilities ?? []) {
              console.log(`::error::${item.VulnerabilityID}: ${item.PkgName} ${item.InstalledVersion}; fixed=${item.FixedVersion}; severity=${item.Severity}`);
            }'
      - name: Upload image vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-v2-trivy
          path: backend-v2-trivy.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop image smoke test
        if: always()
        run: docker rm --force resq-backend-v2-smoke 2>/dev/null || true
